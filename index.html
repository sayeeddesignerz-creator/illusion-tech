<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Illusion Tech</title>
  <meta name="description" content="A simple hello world page by Illusion Tech." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />
  <style>
    :root {
      --bg: #0b0d12;
      --bg-2: #11151f;
      --text: #e8ecf4;
      --muted: #8b96ad;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 2rem;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.14), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: min(640px, 100%);
      padding: clamp(2rem, 6vw, 3.5rem);
      text-align: center;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      margin-bottom: 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-2);
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.08);
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 10px var(--accent-2);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--text) 20%, var(--accent) 55%, var(--accent-2) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.5s ease-in-out infinite;
    }

    p {
      margin-top: 1.25rem;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 2.25rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(120deg, var(--accent), #5b7cfa);
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124, 92, 255, 0.5);
    }

    .btn-ghost {
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-ghost:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: rgba(139, 150, 173, 0.7);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%, 40% { transform: rotate(-8deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>Illusion Tech</span>
    <h1>Hello, World! <span class="wave">👋</span></h1>
    <p>
      Welcome to the very first page of the Illusion Tech repository.
      Simple, fast, and built with nothing but HTML and CSS.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="https://github.com/illusiontechai" target="_blank" rel="noopener">View on GitHub</a>
      <a class="btn btn-ghost" href="#learn-more" id="learn-more">Learn more</a>
    </div>
    <footer>&copy; <span id="year">2026</span> Illusion Tech</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
